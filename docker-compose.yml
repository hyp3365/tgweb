services:
  tg-stream:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TG_API_ID: "${TG_API_ID}"
      TG_API_HASH: "${TG_API_HASH}"
      TG_SESSION: "data/tg.session"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      WEB_PATH: "${WEB_PATH:-}"
      TG_PARALLEL: "${TG_PARALLEL:-2}"
