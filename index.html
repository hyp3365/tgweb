<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>首页</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#000;color:#e8e8e8;margin:0;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 40px}
section{background:#0d0d0d;border:1px solid #222;border-radius:14px;padding:16px;margin:16px 0}
h2{font-size:18px;margin:0 0 12px;font-weight:700}
input,button{padding:10px 12px;font-size:15px;margin:4px 4px 4px 0;border-radius:8px}
input{background:#111;color:#fff;border:1px solid #333}
button{background:#fff;color:#000;border:1px solid #fff;cursor:pointer;font-weight:600}
button:active{opacity:.85}
video{width:100%;max-height:520px;background:#000;border-radius:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:#888;font-size:13px}
.item{border-top:1px solid #222;padding:12px 0}
.hidden{display:none !important}
.topbar{position:sticky;top:0;z-index:10;background:#000;display:flex;justify-content:space-between;align-items:center;padding:1px 0;border-bottom:1px solid #222}
.topbar button{padding:0 8px;font-size:12px;line-height:1.4;background:#1a1a1a;color:#ddd;border-color:#333}
/* 搜索框压矮 */
.search-section{padding:6px 10px;margin:10px 0}
.search-row{flex-wrap:nowrap}
.search-row input{flex:1 1 0;min-width:0;width:auto}
.search-row button{flex-shrink:0}
#q{height:24px;padding:4px 8px;font-size:13px}
.search-row button{height:24px;padding:4px 12px;font-size:13px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{width:100%;max-width:380px;background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:32px 28px;text-align:center}
.login-box p{margin:0 0 16px}
.login-box input{width:100%;padding:12px;margin:12px 0}
.login-box button{width:100%;padding:12px;margin-top:8px}
#gateError{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:8px}
.login-error{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:8px}
.login-box .link-btn{background:none;border:none;color:#888;font-weight:400;text-decoration:underline;padding:8px 0;margin-top:4px}
#loginView .login-box{margin:40px auto}
.login-step-title{font-size:18px;font-weight:700;margin:0 0 16px;text-align:center}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.channel-card{border:1px solid #222;border-radius:12px;padding:14px;cursor:pointer;background:#0d0d0d}
.channel-card:hover{border-color:#555;background:#141414}
.channel-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.channel-row .channel-info{min-width:0}
.channel-row .channel-info b{font-size:15px}
.channel-actions{display:flex;gap:6px;flex-shrink:0}
.channel-actions button{padding:6px 12px;font-size:13px;margin:0}
.chat-wrap{max-width:760px;margin:0 auto}
.chat-msg{background:#111;border:1px solid #222;border-radius:12px;padding:10px 12px;margin:10px 0}
.chat-msg .chat-meta{color:#888;font-size:12px;margin-bottom:4px}
.chat-msg img{max-width:100%;border-radius:8px;display:block;margin-top:6px}
.chat-thumb{position:relative;max-width:320px;aspect-ratio:16/9;background:#111;border-radius:8px;overflow:hidden;cursor:pointer;margin-top:6px}
.chat-thumb img{width:100%;height:100%;object-fit:cover;margin:0}
.chat-input-row{position:sticky;bottom:0;background:#000;padding:10px 0;display:flex;gap:8px}
.search-item{cursor:pointer}
.chat-link{color:#8ab4ff;text-decoration:underline;cursor:pointer}
.chat-input-row input{flex:1;padding:10px 12px}
.chat-input-row button{padding:10px 18px}
.channel-card b{font-size:15px}
.videos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.video-card{border:1px solid #222;border-radius:12px;overflow:hidden;background:#0d0d0d}
.video-card:hover{border-color:#444}
.thumb{position:relative;aspect-ratio:16/9;background:#111;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:28px}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);padding:2px 6px;border-radius:6px;font-size:12px;color:#fff}
.video-body{padding:12px}
.video-title{font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.video-body button{margin-top:8px;padding:7px 14px;font-size:13px}
.back-btn{padding:7px 12px;font-size:13px;background:#1a1a1a;color:#ddd;border-color:#333}
.page-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.sticky-header{position:sticky;top:22px;z-index:9;background:#000;display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #222;margin-bottom:12px}
.sticky-header h2{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticky-header button{flex-shrink:0;margin:0}
.page-header h2{margin:0;flex:1;min-width:120px}
.toggle-btn{padding:6px 12px;font-size:13px;margin:0}
.toggle-btn.active{background:#fff;color:#000;border-color:#fff}
.toggle-btn:not(.active){background:#1a1a1a;color:#ddd;border-color:#333}
#chatLoadMoreBtn{height:28px;padding:4px 14px;font-size:13px;line-height:1.4}
.inline-kb{margin-top:10px}
.kb-row{display:flex;gap:6px;margin-bottom:6px}
.kb-btn{flex:1;background:#2f9e44;color:#fff;border-color:#2f9e44;padding:10px 4px;font-size:14px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;text-decoration:none}
a.kb-btn{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{width:100%;max-width:900px;position:relative}
.seek-feedback{position:absolute;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:#fff;padding:10px 16px;border-radius:20px;font-size:16px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.seek-feedback.show{opacity:1}
.modal-box video{width:100%;max-height:80vh;background:#000;border-radius:12px}
.modal-close{display:block;margin-left:auto;margin-bottom:10px;padding:7px 14px;font-size:14px}
</style></head><body>

<!-- 第一步：网页密码，全黑居中登录框 -->
<div id="gate">
  <div class="login-box">
    <p class="muted">请输入网页密码进入</p>
    <input id="webPw" type="password" placeholder="网页密码" autocomplete="current-password">
    <button onclick="webLogin()">进入</button>
    <div id="gateError"></div>
  </div>
</div>

<!-- 通过网页密码后才显示 -->
<div id="app" class="hidden">
<div class="wrap">
<div class="topbar">
  <span id="status" class="muted" style="font-size:12px;line-height:1.4">正在检查登录状态…</span>
  <span><button id="logoutBtn" class="hidden" onclick="logout()">退出账号</button><button onclick="webLogout()">退出网页登录</button></span>
</div>

<!-- 网页密码通过后，先进入这个检查页，再决定去登录页还是频道页 -->
<div id="checkingView" class="hidden">
  <section>
  <h2>正在检查账号登录状态…</h2>
  <p class="muted">网页密码已通过，正在确认账号有没有登录。</p>
  </section>
</div>

<!-- 第二步：账号登录页（未登录账号时只显示这一页），分三步走，一步只显示一步 -->
<div id="loginView">
  <div class="login-box">
    <div id="loginStep1">
      <p class="login-step-title">登录账号</p>
      <input id="phone" placeholder="手机号，带区号，如 +86138xxxxxxx" autocomplete="tel">
      <button onclick="sendCode()">获取验证码</button>
      <div id="loginError1" class="login-error"></div>
    </div>
    <div id="loginStep2" class="hidden">
      <p class="login-step-title">输入验证码</p>
      <p class="muted" id="codeSentTo"></p>
      <input id="code" placeholder="验证码" inputmode="numeric" autocomplete="one-time-code">
      <button onclick="submitCode()">下一步</button>
      <button class="link-btn" onclick="backToPhone()">换个手机号</button>
      <div id="loginError2" class="login-error"></div>
    </div>
    <div id="loginStep3" class="hidden">
      <p class="login-step-title">两步验证</p>
      <input id="twofa" type="password" placeholder="两步验证密码" autocomplete="current-password">
      <button onclick="submitPassword()">登录</button>
      <div id="loginError3" class="login-error"></div>
    </div>
  </div>
</div>

<!-- 第三步：登录后进入的新页面：所有频道 -->
<div id="channelsView" class="hidden">
  <section class="search-section">
  <div class="row search-row">
  <input id="q" placeholder="名称、@用户名或链接" size="36">
  <button onclick="doSearch()">搜索</button>
  <button onclick="hideSearchResults()">隐藏结果</button>
  </div>
  <div id="searchResults"></div>
  </section>
  <h2>所有频道</h2>
  <div id="channels" class="channels-grid muted">正在加载…</div>
</div>

<!-- 第四步：点击频道进入的新页面：该频道视频 -->
<div id="channelView" class="hidden">
  <div class="sticky-header">
    <button class="back-btn" onclick="backToChannels()">← 返回所有频道</button>
    <h2 id="channelTitle">频道</h2>
    <button class="toggle-btn" onclick="switchToChat()">聊天</button>
    <button class="toggle-btn active">视频</button>
    <button id="joinBtnVideo" class="toggle-btn hidden" onclick="joinCurrentChannel()">加入</button>
  </div>
  <div id="videos" class="videos-grid muted">正在加载…</div>
  <div id="loadMoreWrap" class="hidden" style="text-align:center;margin:16px 0">
    <button id="loadMoreBtn" onclick="loadMoreVideos()">加载更多</button>
    <span id="loadMoreStatus" class="muted"></span>
  </div>
</div>

<!-- 聊天模式：正常聊天，文字/图片/视频都能看，底部可以输入文字发消息 -->
<div id="chatView" class="hidden">
  <div class="chat-wrap">
  <div class="sticky-header">
    <button class="back-btn" onclick="backToChannels()">← 返回所有频道</button>
    <h2 id="chatTitle">聊天</h2>
    <button class="toggle-btn active">聊天</button>
    <button class="toggle-btn" onclick="switchToVideo()">视频</button>
    <button id="joinBtnChat" class="toggle-btn hidden" onclick="joinCurrentChannel()">加入</button>
  </div>
  <div class="row" style="padding:8px 10px">
  <input id="chatSearchInput" placeholder="在频道里搜索消息…" style="flex:1">
  <button onclick="searchChatMessages()">搜索消息</button>
  <button id="clearChatSearchBtn" class="hidden" onclick="clearChatSearch()">× 清除</button>
  </div>
  <div id="chatLoadMoreWrap" class="hidden" style="text-align:center;margin:10px 0">
    <button id="chatLoadMoreBtn" onclick="loadOlderChat()">加载更早的消息</button>
  </div>
  <div id="chatMessages"></div>
  <div id="chatSearchNextWrap" class="hidden" style="text-align:center;margin:16px 0">
    <button id="chatSearchNextBtn" onclick="loadMoreSearchMessages()">下一页</button>
    <span id="chatSearchNextStatus" class="muted"></span>
  </div>
  <div id="chatNewMsgBar" class="hidden" style="text-align:center;margin:10px 0">
    <button onclick="showNewChatMessages()">有新消息，点击查看</button>
  </div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="输入消息…">
    <button onclick="sendChatMessage()">发送</button>
  </div>
  </div>
</div>

</div>
</div>

<!-- 点击视频弹出的播放器：固定在屏幕中间，不滚动页面 -->
<div id="playerModal" class="hidden modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closePlayer()">× 关闭</button>
    <video id="player" controls preload="metadata"></video>
    <div id="seekFeedback" class="seek-feedback"></div>
  </div>
</div>

<script>
let currentChannelId = null;
let currentChannelTitle = '';
let currentChannelUsername = '';
let joinedIds = new Set();
function updateJoinButtons(){
  const show = currentChannelId && !joinedIds.has(currentChannelId);
  ['joinBtnVideo','joinBtnChat'].forEach(id=>{
    const b = document.getElementById(id);
    if (b) b.classList.toggle('hidden', !show);
  });
}
async function joinCurrentChannel(){
  if (!currentChannelId) return;
  try{
    const d = await api('/api/join',{method:'POST', body:JSON.stringify({channel: currentChannelUsername ? '@'+currentChannelUsername : String(currentChannelId)})});
    if (d.joined?.id) joinedIds.add(d.joined.id);
    joinedIds.add(currentChannelId);
    updateJoinButtons();
    alert('已加入，返回所有频道就能看到它');
  }catch(e){ alert(e.message); }
}
let videoOffset = 0;
let videoHasMore = false;
let videoLoading = false;
function showGate(){
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
function showApp(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}
function showView(name){
  ['loginView','channelsView','channelView','checkingView','chatView'].forEach(id=>{
    document.getElementById(id).classList.toggle('hidden', id !== name);
  });
}
const WEB_BASE = (()=>{ const seg = window.location.pathname.split('/').filter(Boolean)[0]; return seg ? '/' + seg : ''; })();
async function api(path, opts={}) {
  const r = await fetch(WEB_BASE + path, {credentials:'same-origin', headers:{'Content-Type':'application/json'}, ...opts});
  if (r.status === 401) {
    const d = await r.json().catch(()=>({}));
    if (d.detail === 'need_web_auth') { showGate(); throw new Error('需要先输入网页密码'); }
    throw new Error(d.detail || '未登录账号');
  }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.detail || ('请求失败 '+r.status));
  return d;
}
function fmtSize(n){ if(n==null) return ''; const u=['B','KB','MB','GB']; let i=0; while(n>=1024&&i<3){n/=1024;i++;} return n.toFixed(1)+' '+u[i]; }
function fmtDur(s){ if(s==null) return ''; s = Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function linkify(s){
  // s 已经是 esc 过的文本：把 t.me/用户名 和 @用户名 变成可点链接，点开就是新频道/群组
  let out = s.replace(/https?:\/\/t\.me\/(?!c\/|s\/|joinchat|\+)([A-Za-z0-9_]+)/g, (m,u)=>`<a class="chat-link" onclick="event.stopPropagation();openChannelLink('${u}')">${m}</a>`);
  out = out.replace(/(^|[^A-Za-z0-9_@])@([A-Za-z0-9_]{4,})/g, (m,pre,u)=>`${pre}<a class="chat-link" onclick="event.stopPropagation();openChannelLink('${u}')">@${u}</a>`);
  return out;
}
async function openChannelLink(username){
  try{
    const d = await api('/api/resolve?username='+encodeURIComponent(username));
    loadChat(d.id, d.title||username, d.username||username);
  }catch(e){ alert(e.message); }
}
async function webLogin(){
  const pw = document.getElementById('webPw').value;
  const err = document.getElementById('gateError');
  err.textContent = '';
  try{
    await api('/api/web-login',{method:'POST',body:JSON.stringify({password:pw})});
    // 输入网页密码后先检查账号登录：没登录就停在登录页并提示登录
    await refreshStatus();
  }catch(e){
    err.textContent = e.message || '密码不对，请重试';
  }
}
document.getElementById('webPw').addEventListener('keydown', e=>{ if(e.key==='Enter') webLogin(); });
function showLoginStep(n){
  ['loginStep1','loginStep2','loginStep3'].forEach((id,i)=>{
    document.getElementById(id).classList.toggle('hidden', i !== n - 1);
  });
  ['loginError1','loginError2','loginError3'].forEach(id=>{
    const e = document.getElementById(id); if (e) e.textContent = '';
  });
}
function clearLoginInputs(){
  ['phone','code','twofa'].forEach(id=>{
    const e = document.getElementById(id); if (e) e.value = '';
  });
}
function backToPhone(){
  showLoginStep(1);
  const p = document.getElementById('phone'); if (p) p.focus();
}
async function refreshStatus(){
  // 网页密码通过后，先进入检查页
  showApp();
  showView('checkingView');
  try{
    const s = await api('/api/status');
    document.getElementById('logoutBtn').classList.toggle('hidden', !s.logged_in);
    if (!s.configured) {
      document.getElementById('status').textContent = '服务器还没配置凭证，请先在服务器上用 tg 命令配置';
      showView('loginView');
      showLoginStep(1);
      clearLoginInputs();
    } else if (!s.logged_in) {
      document.getElementById('status').textContent = '未登录账号，请先登录';
      showView('loginView');
      showLoginStep(1);
      clearLoginInputs();
    } else {
      clearLoginInputs();
      document.getElementById('status').textContent = '已登录：'+(s.me?.name||'')+(s.me?.username?' @'+s.me.username:'');
      // 登录后进入新页面：所有频道
      showView('channelsView');
      loadChannels();
    }
  }catch(e){
    if (e.message !== '需要先输入网页密码') {
      document.getElementById('status').textContent = e.message;
      showView('loginView');
      showLoginStep(1);
      clearLoginInputs();
    }
  }
}
async function sendCode(){
  const err = document.getElementById('loginError1'); err.textContent = '';
  const phone = document.getElementById('phone').value.trim();
  if (!phone) { err.textContent = '请先填手机号'; return; }
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({phone})});
    document.getElementById('codeSentTo').textContent = '验证码已发送到app';
    document.getElementById('code').value = '';
    showLoginStep(2);
    document.getElementById('code').focus();
  }catch(e){ err.textContent = e.message || '获取验证码失败'; }
}
async function submitCode(){
  const err = document.getElementById('loginError2'); err.textContent = '';
  const code = document.getElementById('code').value.trim();
  if (!code) { err.textContent = '请先填验证码'; return; }
  try{
    const d = await api('/api/code',{method:'POST',body:JSON.stringify({code})});
    // 只有开了两步验证的账号才会走到第三步，没开的直接登录成功
    if(d.need_password){
      document.getElementById('twofa').value = '';
      showLoginStep(3);
      document.getElementById('twofa').focus();
      return;
    }
    await refreshStatus();
  }catch(e){ err.textContent = e.message || '验证码不对，请重试'; }
}
async function submitPassword(){
  const err = document.getElementById('loginError3'); err.textContent = '';
  const password = document.getElementById('twofa').value;
  if (!password) { err.textContent = '请先填两步验证密码'; return; }
  try{
    await api('/api/password',{method:'POST',body:JSON.stringify({password})});
    await refreshStatus();
  }catch(e){ err.textContent = e.message || '两步验证密码不对，请重试'; }
}
document.getElementById('phone').addEventListener('keydown', e=>{ if(e.key==='Enter') sendCode(); });
document.getElementById('code').addEventListener('keydown', e=>{ if(e.key==='Enter') submitCode(); });
document.getElementById('twofa').addEventListener('keydown', e=>{ if(e.key==='Enter') submitPassword(); });
async function webLogout(){ try{ await api('/api/web-logout',{method:'POST'}); }catch(e){} showGate(); }
async function logout(){ try{ await api('/api/logout',{method:'POST'}); }catch(e){} await refreshStatus(); }
let searchResultsCache = [];
let searchPage = 0;
const SEARCH_PAGE_SIZE = 30;
function hideSearchResults(){ searchResultsCache = []; searchPage = 0; document.getElementById('searchResults').innerHTML = ''; }
function renderSearchPage(){
  const box = document.getElementById('searchResults');
  if (!searchResultsCache.length) { box.innerHTML = '<div class="muted">没搜到。私密订阅搜不到是正常的，用邀请链接直接加入。</div>'; return; }
  const start = searchPage * SEARCH_PAGE_SIZE;
  const page = searchResultsCache.slice(start, start + SEARCH_PAGE_SIZE);
  const hasNext = start + SEARCH_PAGE_SIZE < searchResultsCache.length;
  const hasPrev = searchPage > 0;
  box.innerHTML = `<div style="text-align:right;margin-bottom:6px"><button data-action="close" style="padding:4px 10px;font-size:13px">× 关闭</button></div>` + page.map(r=>
    `<div class="item search-item" data-id="${r.id}" data-title="${esc(r.title)}" data-username="${esc(r.username||'')}"><b>${linkify(esc(r.title))}</b> ${r.username?`<span class="chat-link">@${esc(r.username)}</span>`:''} <span class="muted">${esc(r.type)}</span><br>
     <button data-action="join" data-ch="${esc(r.username||r.id)}">加入</button>
     <button data-action="chat">聊天</button>
     <button data-action="video">视频</button></div>`).join('')
    + `<div style="text-align:center;margin:12px 0"><span class="muted">第 ${searchPage + 1} 页，共 ${searchResultsCache.length} 条</span><br>
    ${hasPrev ? `<button onclick="searchPage--;renderSearchPage()" style="margin-top:6px;padding:6px 12px;font-size:13px">上一页</button> ` : ''}
    ${hasNext ? `<button onclick="searchPage++;renderSearchPage()" style="margin-top:6px;padding:6px 12px;font-size:13px">下一页</button>` : (searchPage > 0 ? `<span class="muted" style="margin-left:8px">已经没有更多了</span>` : '')}</div>`;
}
async function doSearch(){

}

// 双击快进/快退：左半边快退 10 秒，右半边快进 10 秒，中间弹一下提示就消失。
// 不只视频框里，播放器黑边区域（视频框外面）双击也一样生效，左右按屏幕中间分。
// 只有一种情况不触发：双击点在视频本身的底部控制条（进度条/音量/全屏按钮）上，
// 免得点进度条也跳 10 秒；关闭按钮双击也不触发，点关闭就是关闭。
// preventDefault 是为了挡住浏览器自带的双击全屏，否则一点双击就全屏了。
// 注意：监听挂在整个播放器弹窗上，不再只挂视频上，否则视频上的双击会冒泡到弹窗，
// 一次双击会被算两次，变成 20 秒。
let seekFeedbackTimer = null;
function showSeekFeedback(dir){
  const f = document.getElementById('seekFeedback');
  if (!f) return;
  f.textContent = dir < 0 ? '◀◀ 快退 10 秒' : '快进 10 秒 ▶▶';
  f.style.left = dir < 0 ? '30%' : '70%';
  f.classList.add('show');
  clearTimeout(seekFeedbackTimer);
  seekFeedbackTimer = setTimeout(()=>{ f.classList.remove('show'); }, 700);
}
document.getElementById('playerModal').addEventListener('dblclick', e=>{
  if (e.target && e.target.closest && e.target.closest('.modal-close')) return;
  const p = document.getElementById('player');
  e.preventDefault(); e.stopPropagation();
  const r = p.getBoundingClientRect();
  const insideVideo = r.width && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (insideVideo && e.clientY > r.bottom - 48) return;
  const center = insideVideo ? (r.left + r.width / 2) : (window.innerWidth / 2);
  const dir = e.clientX < center ? -1 : 1;
  let nt = (p.currentTime || 0) + dir * 10;
  if (nt < 0) nt = 0;
  if (isFinite(p.duration) && nt > p.duration) nt = p.duration;
  p.currentTime = nt;
  showSeekFeedback(dir);
});

function videoCards(videos, channelId){

      ? `<img src="${WEB_BASE}/thumb/${channelId}/${v.msg_id}${currentChannelUsername ? `?username=${encodeURIComponent(currentChannelUsername)}` : ''}" loading="lazy" alt="" onerror="this.parentElement.innerHTML='<div class=thumb-placeholder>▶</div>'">`
      : `<div class="thumb-placeholder">▶</div>`;
    return `<div class="video-card">
     <div class="thumb" onclick="playVideo(${channelId},${v.msg_id})">${thumb}<span class="dur">${fmtDur(v.duration)}</span></div>
     <div class="video-body"><div class="video-title">${title}</div>
     <span class="muted">${v.date?new Date(v.date).toLocaleString():''} · ${fmtSize(v.size)}</span><br>
     <button onclick="playVideo(${channelId},${v.msg_id})">播放</button></div></div>`;
  }).join('');
}

let currentChatChannelId = null;
let chatOldestId = 0;

function chatBubble(m, channelId){
  let body = '';
  if (m.text) body += `<div>${linkify(esc(m.text)).replace(/\n/g,'<br>')}</div>`;
  if (m.kind === 'photo') body += `<img src="${WEB_BASE}/photo/${channelId}/${m.msg_id}${currentChannelUsername ? `?username=${encodeURIComponent(currentChannelUsername)}` : ''}" loading="lazy" alt="">`;
  if (m.kind === 'video') {
    const thumb = m.has_thumb
      ? `<img src="${WEB_BASE}/thumb/${channelId}/${m.msg_id}${currentChannelUsername ? `?username=${encodeURIComponent(currentChannelUsername)}` : ''}" loading="lazy" alt="" onerror="this.parentElement.innerHTML='<div class=thumb-placeholder>▶</div>'">`
      : `<div class="thumb-placeholder">▶</div>`;
    body += `<div class="chat-thumb" onclick="playVideo(${channelId},${m.msg_id})">${thumb}<span class="dur">${fmtDur(m.duration)}</span></div><button onclick="playVideo(${channelId},${m.msg_id})" style="margin-top:6px;padding:6px 12px;font-size:13px">播放视频</button>`;
  }
  if (m.kind === 'document') body += `<div class="muted">[文件] ${esc(m.filename || '')} ${fmtSize(m.size)}</div>`;
  if (!body) body = '<div class="muted">[这条消息没有文字]</div>';
  if (m.buttons && m.buttons.length) {
    kbCache[channelId + ":" + m.msg_id] = m.buttons;
    body += `<div class="inline-kb">` + m.buttons.map((row, ri) => `<div class="kb-row">` + row.map((b, ci) => {
      if (b.type === 'url' && b.url && /^https?:\/\//.test(b.url)) return `<a class="kb-btn" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.text)}</a>`;
      return `<button class="kb-btn" onclick="clickInlineBtn(${channelId},${m.msg_id},${ri},${ci})">${esc(b.text)}</button>`;
    }).join('') + `</div>`).join('') + `</div>`;
  }
  return `<div class="chat-msg"><div class="chat-meta">${m.date?new Date(m.date).toLocaleString():''}</div>${body}</div>`;
}
async function loadChat(channelId, title, username=''){
  currentChatChannelId = channelId;
  currentChannelId = channelId;
  currentChannelTitle = title || '';
  currentChannelUsername = username || '';
  updateJoinButtons();
  hideSearchResults();
  document.getElementById('chatTitle').textContent = title || '频道';
  document.getElementById('chatMessages').innerHTML = '正在加载…';
  document.getElementById('chatLoadMoreWrap').classList.add('hidden');
  chatSearching = false; chatSearchQ = ''; chatSearchOffset = 0; chatSearchHasMore = false;

  document.getElementById('clearChatSearchBtn').classList.add('hidden');
  document.getElementById('chatSearchNextWrap').classList.add('hidden');

async function loadChatPage(appendOlder){
  if (chatLoading) return;
  chatLoading = true;
  const btn = document.getElementById('chatLoadMoreBtn');
  if (appendOlder) { btn.disabled = true; btn.textContent = '正在加载…'; }
  try{
    const d = await api(`/api/messages?channel_id=${currentChatChannelId}&limit=30&offset_id=${chatOldestId}` + (currentChannelUsername ? `&username=${encodeURIComponent(currentChannelUsername)}` : ''));
    const box = document.getElementById('chatMessages');
    const chronological = [...d.messages].reverse();
    if (!appendOlder) {
      box.innerHTML = d.messages.length ? chronological.map(m=>chatBubble(m, currentChatChannelId)).join('')
        : '<div class="muted">这个频道还没有消息。</div>';
      chatDisplayedIds = new Set(chronological.map(m=>m.msg_id));
      chatNewestId = chronological.length ? Math.max(...chronological.map(m=>m.msg_id)) : 0;
      hideChatNewMsgBar();
      window.scrollTo({top:document.body.scrollHeight, behavior:'auto'});
    } else if (d.messages.length) {
      // 加载更早的消息：新消息在上面，旧位置不动，往上滑就能看到新消息。
      // 以前是直接跳到最顶，要往下滑一堆才能回到原来的位置，现在锚定原来的位置：
      // 先记下加载前的页面高度和滚动位置，插完新消息后把滚动位置往下补同样高度，
      // 这样原来在屏幕上的那条消息还在原地，新消息就在它上面，往上滑就能看到。
      const oldHeight = document.body.scrollHeight;
      const oldScrollY = window.scrollY;
      chronological.forEach(m=>chatDisplayedIds.add(m.msg_id));
      box.insertAdjacentHTML('afterbegin', chronological.map(m=>chatBubble(m, currentChatChannelId)).join(''));
      const delta = document.body.scrollHeight - oldHeight;
      window.scrollTo({top: oldScrollY + delta, behavior:'auto'});
    }
    chatHasMore = !!d.has_more;
    chatOldestId = d.next_offset_id || chatOldestId;
    const wrap = document.getElementById('chatLoadMoreWrap');
    if (chatHasMore) {
      wrap.classList.remove('hidden');
      btn.disabled = false; btn.textContent = '加载更早的消息';
    } else {
      wrap.classList.add('hidden');
    }
  }catch(e){ alert(e.message); await refreshStatus(); }
  chatLoading = false;
}

// 聊天自动刷新：每 3 秒查一次最新消息，不用退出重进就能看到频道/机器人的回复。
// 只在聊天页可见、没在搜消息、没在看视频播放器、页面没切到后台时才查；
// 查失败不弹窗，下一次再查。已经在屏幕上的消息按 id 去重，不会重复出现。
// 如果你正在看底部的最新消息，新消息来了就自动滑到底部；
// 如果你在往上翻旧消息，新消息会先贴在下面，不强制把你拉到底部，
// 而是显示“有新消息，点击查看”，点了才滑到底部。
async function pollNewChatMessages(){
  if (!currentChatChannelId) return;
  const cv = document.getElementById('chatView');
  if (!cv || cv.classList.contains('hidden')) return;
  if (chatSearching) return;
  if (document.hidden) return;
  const pm = document.getElementById('playerModal');
  if (pm && !pm.classList.contains('hidden')) return;
  try{
    const d = await api(`/api/messages?channel_id=${currentChatChannelId}&limit=30&offset_id=0` + (currentChannelUsername ? `&username=${encodeURIComponent(currentChannelUsername)}` : ''));
    const chronological = [...d.messages].reverse();
    const fresh = chronological.filter(m=>!chatDisplayedIds.has(m.msg_id));
    if (!fresh.length) return;
    fresh.forEach(m=>{ chatDisplayedIds.add(m.msg_id); if (m.msg_id > chatNewestId) chatNewestId = m.msg_id; });
    const box = document.getElementById('chatMessages');
    if (box.textContent.includes('还没有消息')) box.innerHTML = '';
    box.insertAdjacentHTML('beforeend', fresh.map(m=>chatBubble(m, currentChatChannelId)).join(''));
    const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 300);
    if (nearBottom) {
      hideChatNewMsgBar();
      window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
    } else {
      chatUnreadCount += fresh.length;
      const bar = document.getElementById('chatNewMsgBar');
      if (bar) {
        bar.classList.remove('hidden');
        const btn = bar.querySelector('button');
        if (btn) btn.textContent = '有 ' + chatUnreadCount + ' 条新消息，点击查看';
      }
    }
  }catch(e){ /* 静默，下一次再查 */ }
}
setInterval(pollNewChatMessages, 3000);

let kbCache = {};
async function clickInlineBtn(channelId, msgId, row, col){
  const btn = (kbCache[channelId + ':' + msgId] || [])[row] ? kbCache[channelId + ':' + msgId][row][col] : null;
  if (!btn) return;
  if (btn.type === 'switch' && btn.query) {
    const inp = document.getElementById('chatSearchInput');
    if (inp) { inp.value = btn.query; searchChatMessages(); }
    return;
  }
  try{
    const d = await api('/api/callback',{method:'POST', body:JSON.stringify({channel_id: channelId, msg_id: msgId, row, col, username: currentChannelUsername || null})});
    if (d.url) { if (/^https?:\/\//.test(d.url)) window.open(d.url, '_blank'); else alert('这个链接不是 http/https，已拦截：' + d.url); }
    else if (d.alert) alert(d.alert);
    // 机器人点完按钮一般会改原消息或发新消息（比如下一页），等一下再刷新聊天就能看到
    setTimeout(()=>{
      chatSearching = false; chatSearchQ = ''; chatSearchOffset = 0; chatSearchHasMore = false;
      const csi = document.getElementById('chatSearchInput'); if (csi) csi.value = '';
      document.getElementById('clearChatSearchBtn').classList.add('hidden');
      document.getElementById('chatSearchNextWrap').classList.add('hidden');
      chatOldestId = 0; chatHasMore = false;
      loadChatPage(false);
    }, 800);
  }catch(e){ alert(e.message); }
}
