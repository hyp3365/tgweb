a.kb-btn{display:block}
/* 播放器框拉大、两边空减少约 75%：弹窗内边距 16px→4px（正好减 75%），
   框最大宽 900px→1600px。按 1920 宽的屏幕算，两边原来约 526px，
   现在约 164px，降了约 69%，接近 75%；手机上两边就是 16px→4px，正好 75%。
   不同屏幕宽算出来的百分比不一样，没法所有屏幕都正好 75%，所以按这个办法做。
   视频高还是最多 80vh，16:9 的视频高到顶后宽会跟着收一点，这是高限制，不是框没拉大。
   关闭按钮固定在屏幕底部居中，不放在播放器框里：之前放框下面、靠右，
   正好落在右半边双击快进的区域里，双击快进时容易误点成关闭。
   现在放屏幕底边中间，左右快进区在它两边，中间本来就是左右分界，不会挡快进；
   双击按钮本身还是被双击处理排除的，不会触发快进。
   弹窗底部内边距留 64px 给这个按钮（按钮高约 35px + 离底边 16px + 空隙），
   这样播放器框底边和按钮之间总有空隙，按钮不会压住进度条的时间文字。 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;z-index:100;padding:4px 4px 64px 4px;touch-action:none}
.modal-box{width:100%;max-width:1600px;position:relative}
/* 单手用手机时：播放器沉到底部附近，进度条就在拇指附近，不用够到屏幕中间去拖。
   只在触屏或窄屏上这样，电脑鼠标能轻松点中间，电脑上还是居中，不会变得很怪。
   底部 64px 的空还是给关闭按钮留的，进度条不会被按钮压住。
   横屏和竖屏不能用同一种位置：横屏视频框矮，原来往上抬半个框高（translateY(-50% - 62px)）
   正好落在屏幕下半段中间，改成贴底不动就嫌太下面了，所以横屏保持原来那样。
   竖屏视频框高约 80vh，再抬半个框就是约 40vh，上半约一半直接顶出屏幕上面，
   所以竖屏才贴底不动：竖屏视频高、进度条本来就在底部附近，拇指照样够得到，
   而且框高（视频 80vh + 进度条约 52px）小于贴底可用高度（100vh - 64px 底边距），
   只要手机高超过 600px 就不会超屏，正常手机都满足。
   横竖屏不是看手机方向，而是看视频本身尺寸：JS 在 loadedmetadata 时按
   videoHeight > videoWidth 给框加 portrait-video 类，竖屏才走贴底那条，
   横屏和正方形都不加，还是原来抬半框的位置。 */
@media (pointer: coarse) and (orientation: portrait), (max-width: 768px) and (orientation: portrait) {
  .modal{align-items:flex-end}
  .modal-box{transform:translateY(calc(-50% - 62px))}
  .modal-box.portrait-video{transform:none}
}
.seek-feedback{position:absolute;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:#fff;padding:10px 16px;border-radius:20px;font-size:16px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.seek-feedback.show{opacity:1}
.modal-box video{width:100%;max-height:80vh;max-height:80dvh;background:#000;border-radius:12px;touch-action:none}
.modal-close{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:101;margin:0;padding:7px 14px;font-size:14px}
/* 原生进度条去掉：浏览器自带的 controls 是一整套，没法只关其中一条，
   只能用 WebKit 的伪元素把时间轴藏起来，播放/音量/全屏这些按钮还在。
   这招只在 Chrome/Safari 这类 WebKit 浏览器生效，Firefox 不支持这种伪元素，
   在 Firefox 里原生进度条还会留着——要彻底去掉就得把原生 controls 全拿掉自己重做一套，
   那就不是“只去掉进度条”了，所以先按这个办法做。 */
.modal-box video::-webkit-media-controls-timeline{display:none !important}
.modal-box video::-webkit-media-controls-timeline-container{display:none !important}
/* 常显进度条：不在视频元素里，是弹窗里单独的一条，所以浏览器自带控制条隐藏时它还在，
   一直能看到、能点、能拖。其他都不动：原生的播放/音量/全屏按钮还在，双击快进快退还在。
   宽度缩短 15%：原来是弹窗满宽，现在是 85% 居中，两边各空 7.5%。 */
.player-progress{width:85%;margin:10px auto 0;user-select:none;-webkit-user-select:none;touch-action:none}
.player-progress-track{position:relative;height:24px;display:flex;align-items:center;cursor:pointer}
.player-progress-bar{position:relative;flex:1;height:6px;background:#333;border-radius:3px}
.player-progress-buffered{position:absolute;left:0;top:0;height:100%;background:#555;border-radius:3px;width:0%}
.player-progress-played{position:absolute;left:0;top:0;height:100%;background:#fff;border-radius:3px;width:0%}
.player-progress-thumb{position:absolute;top:50%;left:0%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.player-progress-time{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-top:2px}
</style></head><body>

<!-- 第一步：网页密码，全黑居中登录框 -->
<div id="gate">
  <div class="login-box">
    <p class="muted">请输入网页密码进入</p>
    <input id="webPw" type="password" placeholder="网页密码" autocomplete="current-password">
    <button onclick="webLogin()">进入</button>
    <div id="gateError"></div>
  </div>
</div>

<!-- 通过网页密码后才显示 -->
<div id="app" class="hidden">
<div class="wrap">
<div class="topbar">
  <span id="status" class="muted" style="font-size:12px;line-height:1.4">正在检查登录状态…</span>
  <span><button id="logoutBtn" class="hidden" onclick="logout()">退出账号</button><button onclick="webLogout()">退出网页登录</button></span>
</div>

<!-- 网页密码通过后，先进入这个检查页，再决定去登录页还是频道页 -->
<div id="checkingView" class="hidden">
  <section>
  <h2>正在检查账号登录状态…</h2>
  <p class="muted">网页密码已通过，正在确认账号有没有登录。</p>
  </section>
</div>

<!-- 第二步：账号登录页（未登录账号时只显示这一页），分三步走，一步只显示一步 -->
<div id="loginView">
  <div class="login-box">
    <div id="loginStep1">
      <p class="login-step-title">登录账号</p>
      <input id="phone" placeholder="手机号，带区号，如 +86138xxxxxxx" autocomplete="tel">
      <button onclick="sendCode()">获取验证码</button>
      <div id="loginError1" class="login-error"></div>
    </div>
    <div id="loginStep2" class="hidden">
      <p class="login-step-title">输入验证码</p>
      <p class="muted" id="codeSentTo"></p>
      <input id="code" placeholder="验证码" inputmode="numeric" autocomplete="one-time-code">
      <button onclick="submitCode()">下一步</button>
      <button class="link-btn" onclick="backToPhone()">换个手机号</button>
      <div id="loginError2" class="login-error"></div>
    </div>
    <div id="loginStep3" class="hidden">
      <p class="login-step-title">两步验证</p>
      <input id="twofa" type="password" placeholder="两步验证密码" autocomplete="current-password">
      <button onclick="submitPassword()">登录</button>
      <div id="loginError3" class="login-error"></div>
    </div>
  </div>
</div>

<!-- 第三步：登录后进入的新页面：所有频道 -->
<div id="channelsView" class="hidden">
  <section class="search-section">
  <div class="row search-row">
  <input id="q" placeholder="名称、@用户名或链接" size="36">
  <button onclick="doSearch()">搜索</button>
  <button onclick="hideSearchResults()">隐藏结果</button>
  </div>
  <div id="searchResults"></div>
  </section>
  <h2>所有频道</h2>
  <div id="channels" class="channels-grid muted">正在加载…</div>
</div>

<!-- 第四步：点击频道进入的新页面：该频道视频 -->
<div id="channelView" class="hidden">
  <div class="sticky-header">
    <button class="back-btn" onclick="backToChannels()">← 返回</button>
    <h2 id="channelTitle">频道</h2>
    <button class="toggle-btn" onclick="switchToChat()">聊天</button>
    <button class="toggle-btn active">视频</button>
    <button id="joinBtnVideo" class="toggle-btn hidden" onclick="joinCurrentChannel()">加入</button>
  </div>
  <div id="videos" class="videos-grid muted">正在加载…</div>
  <div id="loadMoreWrap" class="hidden" style="text-align:center;margin:16px 0">
    <button id="loadMoreBtn" onclick="loadMoreVideos()">加载更多</button>
    <span id="loadMoreStatus" class="muted"></span>
  </div>
</div>

<!-- 聊天模式：正常聊天，文字/图片/视频都能看，底部可以输入文字发消息 -->
<div id="chatView" class="hidden">
  <div class="chat-wrap">
  <div class="sticky-header">
    <button class="back-btn" onclick="backToChannels()">← 返回</button>
    <h2 id="chatTitle">聊天</h2>
    <button class="toggle-btn active">聊天</button>
    <button class="toggle-btn" onclick="switchToVideo()">视频</button>
    <button id="joinBtnChat" class="toggle-btn hidden" onclick="joinCurrentChannel()">加入</button>
  </div>
  <div class="row" style="padding:8px 10px">
  <input id="chatSearchInput" placeholder="在频道里搜索消息…" style="flex:1">
  <button onclick="searchChatMessages()">搜索消息</button>
  <button id="clearChatSearchBtn" class="hidden" onclick="clearChatSearch()">× 清除</button>
  </div>
  <div id="chatLoadMoreWrap" class="hidden" style="text-align:center;margin:10px 0">
    <button id="chatLoadMoreBtn" onclick="loadOlderChat()">加载更早的消息</button>
  </div>
  <div id="chatMessages"></div>
  <div id="chatSearchNextWrap" class="hidden" style="text-align:center;margin:16px 0">
    <button id="chatSearchNextBtn" onclick="loadMoreSearchMessages()">下一页</button>
    <span id="chatSearchNextStatus" class="muted"></span>
  </div>
  <div id="chatNewMsgBar" class="hidden" style="text-align:center;margin:10px 0">

  </div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="输入消息…">
    <button id="chatSendBtn" onclick="sendChatMessage()">发送</button>
  </div>
  </div>
</div>

<!-- 评论：频道帖子的评论不在频道里，在关联的讨论组里，这里就是把讨论组里的回复拉出来看和发 -->
<div id="commentsView" class="hidden">
  <div class="chat-wrap">
  <div class="sticky-header">
    <button class="back-btn" onclick="backFromComments()">← 返回</button>

  </div>
  <div id="commentOrig" class="muted" style="padding:8px 10px"></div>
  <div id="commentLoadMoreWrap" class="hidden" style="text-align:center;margin:10px 0">
    <button id="commentLoadMoreBtn" onclick="loadOlderComments()">加载更早的评论</button>
  </div>
  <div id="commentMessages"></div>
  <div class="chat-input-row">
    <input id="commentInput" placeholder="输入评论…">
    <button id="commentSendBtn" onclick="sendComment()">发送</button>
  </div>
  </div>
</div>

</div>
</div>

<!-- 点击视频弹出的播放器：固定在屏幕中间，不滚动页面 -->
<div id="playerModal" class="hidden modal">
  <div class="modal-box">
    <video id="player" controls preload="metadata"></video>
    <div id="playerProgress" class="player-progress">
      <div id="playerProgressTrack" class="player-progress-track">
        <div class="player-progress-bar">
          <div id="playerProgressBuffered" class="player-progress-buffered"></div>
          <div id="playerProgressPlayed" class="player-progress-played"></div>

      </div>

<!-- 全部频道长按弹出的删除确认：只在全部频道列表里长按才出现，点开频道后不出现。
     频道和群组是退出，机器人是删对话，文案按类型区分，私密的退出后可能回不来，所以要先确认。 -->
<div id="channelDeleteModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px">
  <div style="background:#111;border:1px solid #333;border-radius:12px;padding:20px;max-width:340px;width:100%">
    <div id="channelDeleteTitle" style="font-weight:700;margin-bottom:8px"></div>
    <div id="channelDeleteHint" class="muted" style="margin-bottom:16px"></div>
    <div style="display:flex;gap:10px">
      <button id="channelDeleteConfirm" onclick="confirmChannelDelete()" style="background:#c0392b;color:#fff;border-color:#c0392b">删除</button>
      <button onclick="hideChannelDelete()">取消</button>
    </div>
  </div>
</div>

<script>
let currentChannelId = null;
let currentChannelTitle = '';
let currentChannelUsername = '';
let joinedIds = new Set();
function updateJoinButtons(){
  const show = currentChannelId && !joinedIds.has(currentChannelId);
  ['joinBtnVideo','joinBtnChat'].forEach(id=>{
    const b = document.getElementById(id);
    if (b) b.classList.toggle('hidden', !show);
  });
}
async function joinCurrentChannel(){
  if (!currentChannelId) return;
  try{

  // 会先被通用规则吞掉；replace 不会重扫生成出来的 HTML，所以不会在生成的
  // <a> 标签里再套一层；句末的标点（。 ， 、 ）等不算进链接里。
  // @ 替换要跳过已经生成的 <a> 标签：先按 <a>...</a> 切段，只对非标签段做 @ 替换，

// 本页打不开（解析/加入/加载失败）时，退到当前标签页打开原链接；
// 非聊天类（贴纸、分享、代理等）本页没有对话可开，直接在当前标签页打开原链接，
// 分享/预览类如果带了内嵌的目标链接，就打开那个目标链接。
async function openTmeLink(url){

  if (!/^(www\.)?t\.me$/i.test(parsed.hostname)) { location.href = u; return; }

  const first = parts[0] || '';

        else loadChannels();

    // 本页加载失败就本页打开原链接，不弹错。

    if (first === 's' && parts[1]) {

      return;
    }
    // 贴纸、主题、代理等根本不是对话的路径：不浪费一次解析请求，直接本页打开原链接。
    if (['addstickers', 'addtheme', 'addlist', 'proxy', 'socks', 'setlanguage'].includes(first)) {

    // 失败时 openChannelLink 已退到本页打开原链接。
    if (first) {

    }

  }catch(e){ openInPage(u); }
}

function fmtPlayerTime(s){
  if (!isFinite(s) || s < 0) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  return m + ':' + String(sec).padStart(2,'0');
}
let playerDragging = false;
function updatePlayerProgress(){
  const p = document.getElementById('player');
  const played = document.getElementById('playerProgressPlayed');
  const bufferedEl = document.getElementById('playerProgressBuffered');
  const thumb = document.getElementById('playerProgressThumb');
  const curEl = document.getElementById('playerTimeCur');
  const durEl = document.getElementById('playerTimeDur');
  if (!p || !played) return;
  if (playerDragging) return;
  if (!isFinite(p.duration) || !p.duration) {
    played.style.width = '0%'; if (bufferedEl) bufferedEl.style.width = '0%'; if (thumb) thumb.style.left = '0%';
    if (curEl) curEl.textContent = fmtPlayerTime(p.currentTime || 0);
    if (durEl) durEl.textContent = '0:00';
    return;
  }
  const pct = Math.min(100, Math.max(0, (p.currentTime / p.duration) * 100));
  played.style.width = pct + '%';
  if (thumb) thumb.style.left = pct + '%';
  if (bufferedEl) {
    let b = 0;
    try { if (p.buffered && p.buffered.length) b = Math.min(100, Math.max(0, (p.buffered.end(p.buffered.length - 1) / p.duration) * 100)); } catch(e){}
    bufferedEl.style.width = b + '%';
  }
  if (curEl) curEl.textContent = fmtPlayerTime(p.currentTime);
  if (durEl) durEl.textContent = fmtPlayerTime(p.duration);
}
function seekPlayerFromEvent(e){
  const p = document.getElementById('player');
  const track = document.getElementById('playerProgressTrack');
  if (!p || !track || !isFinite(p.duration) || !p.duration) return;
  const r = track.getBoundingClientRect();
  if (!r.width) return;
  let ratio = (e.clientX - r.left) / r.width;
  if (ratio < 0) ratio = 0;
  if (ratio > 1) ratio = 1;
  p.currentTime = ratio * p.duration;
  const played = document.getElementById('playerProgressPlayed');
  const thumb = document.getElementById('playerProgressThumb');
  const curEl = document.getElementById('playerTimeCur');
  if (played) played.style.width = (ratio * 100) + '%';
  if (thumb) thumb.style.left = (ratio * 100) + '%';
  if (curEl) curEl.textContent = fmtPlayerTime(ratio * p.duration);
}
(function initPlayerProgress(){
  const p = document.getElementById('player');
  const prog = document.getElementById('playerProgressTrack');
  if (!p || !prog) return;
  p.addEventListener('timeupdate', updatePlayerProgress);
  p.addEventListener('loadedmetadata', updatePlayerProgress);
  p.addEventListener('durationchange', updatePlayerProgress);
  p.addEventListener('progress', updatePlayerProgress);
  p.addEventListener('ended', updatePlayerProgress);
  prog.addEventListener('pointerdown', e=>{
    e.preventDefault();
    playerDragging = true;
    try { prog.setPointerCapture(e.pointerId); } catch(err){}
    seekPlayerFromEvent(e);
  });
  prog.addEventListener('pointermove', e=>{ if (playerDragging) seekPlayerFromEvent(e); });
  const endDrag = ()=>{ if (playerDragging) { playerDragging = false; updatePlayerProgress(); } };
  prog.addEventListener('pointerup', endDrag);
  prog.addEventListener('pointercancel', endDrag);
})();

// 双击快进/快退：左半边快退 10 秒，右半边快进 10 秒，中间弹一下提示就消失。
// 不只视频框里，播放器黑边区域（视频框外面）双击也一样生效，左右按屏幕中间分。
// 只有一种情况不触发：双击点在视频本身的底部控制条（进度条/音量/全屏按钮）上，
// 免得点进度条也跳 10 秒；关闭按钮双击也不触发，点关闭就是关闭。
// preventDefault 是为了挡住浏览器自带的双击全屏，否则一点双击就全屏了。
// 注意：监听挂在整个播放器弹窗上，不再只挂视频上，否则视频上的双击会冒泡到弹窗，
// 一次双击会被算两次，变成 20 秒。
let seekFeedbackTimer = null;
function showSeekFeedback(dir){
  const f = document.getElementById('seekFeedback');
  if (!f) return;
  f.textContent = dir < 0 ? '◀◀ 快退 10 秒' : '快进 10 秒 ▶▶';
  f.style.left = dir < 0 ? '30%' : '70%';
  f.classList.add('show');
  clearTimeout(seekFeedbackTimer);
  seekFeedbackTimer = setTimeout(()=>{ f.classList.remove('show'); }, 700);
}
document.getElementById('playerModal').addEventListener('dblclick', e=>{
  if (e.target && e.target.closest && e.target.closest('.modal-close')) return;
  // 常显进度条上的双击是拖进度用的，不触发快进快退，否则点两下进度条会先定位再跳 10 秒
  if (e.target && e.target.closest && e.target.closest('#playerProgress')) return;
  const p = document.getElementById('player');
  e.preventDefault(); e.stopPropagation();
  const r = p.getBoundingClientRect();
  const insideVideo = r.width && e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (insideVideo && e.clientY > r.bottom - 48) return;
  const center = insideVideo ? (r.left + r.width / 2) : (window.innerWidth / 2);
  const dir = e.clientX < center ? -1 : 1;
  let nt = (p.currentTime || 0) + dir * 10;
  if (nt < 0) nt = 0;
  if (isFinite(p.duration) && nt > p.duration) nt = p.duration;
  p.currentTime = nt;
  showSeekFeedback(dir);
});
// 滑动快进快退，改成和双击同款：监听挂在整个播放器弹窗上，不是只挂视频上，
// 所以视频框外面的黑边上滑也有效；双击是按屏幕中间分左右，滑动是按滑的方向和距离算。
// 上一版只靠 pointermove 在视频上拖动时没效果：手机浏览器在视频上拖动时会直接
// 把 pointer 取消掉（pointercancel），move 根本没跑到，松手时 swipeActive 还是假的，
// 所以一次都没跳。这版改成三处兜底：
// 1) pointer 和 touch 两套事件都接，touchmove 用非被动监听，横滑时 preventDefault
//    挡住浏览器接管手势，这样 move 不会被取消；
// 2) 松手/取消时都用终点位置再算一次：哪怕中间 move 一次都没来，只要起点到终点
//    横向超过 24px 且横向大于纵向，就算一次滑动，快 flick 一下也有效；
// 3) pointercancel 不再直接丢弃：浏览器取消时手势已经滑出去了，终点距离够就照样跳，
//    只有距离不够或竖滑才不跳。
// 幅度还是按滑过的横向距离占屏幕宽的比例算：滑满一屏宽 = 6 分钟，封顶 6 分钟；
// 只要算成滑动，哪怕滑得短也至少跳 30 秒。向右快进，向左快退，竖着滑不算。
// 不抢已有的操作：起点在常显进度条、关闭按钮、视频底部 48px 原生控制条上
// 的，一律不启动滑动，进度条拖动和原生播放/音量/全屏照常；双击快进快退还在。
let swipeStartX = 0, swipeStartY = 0, swipeStartTime = 0, swipeActive = false, swipeDelta = 0;
let swipeTracking = false;
let swipeEndAt = 0;
function swipeSeekDelta(dx){
  const w = window.innerWidth || 1;
  let sec = Math.abs(dx) / w * 360;

  if (sec > 360) sec = 360;
  return (dx < 0 ? -1 : 1) * sec;
}
function fmtSwipe(sec){
  const s = Math.round(Math.abs(sec));
  return s >= 60 ? Math.floor(s / 60) + '分' + String(s % 60).padStart(2, '0') + '秒' : s + '秒';

function swipeExcluded(target, x, y){

let speedPressTimer = null, speedPressActive = false, speedPressOrigRate = 1;
function startLongPress(){

function swipeMove(x, y){
  if (!swipeTracking) return;
  const dx = x - swipeStartX, dy = y - swipeStartY;
  // 按住后一动就不是长按了：动超过 20px 就取消长按计时，已经切到 2x
  // 的也恢复原速，接下来只算滑动快进。
  if (Math.abs(dx) > 20 || Math.abs(dy) > 20) endLongPress();
  if (!swipeActive) {
    if (Math.abs(dx) <= 24 || Math.abs(dx) <= Math.abs(dy)) return;
    swipeActive = true;
  }
  swipeDelta = swipeSeekDelta(dx);
  const p = document.getElementById('player');
  let target = swipeStartTime + swipeDelta;
  if (target < 0) target = 0;
  if (isFinite(p.duration) && target > p.duration) target = p.duration;
  const f = document.getElementById('seekFeedback');
  if (f) {
    f.textContent = (swipeDelta < 0 ? '◀◀ 快退 ' : '快进 ▶▶ ') + fmtSwipe(swipeDelta) + ' → ' + fmtPlayerTime(target);
    f.style.left = '50%';
    f.classList.add('show');
  }
}
function endSwipe(endX, endY){
  // 松手/取消都先结束长按倍速：没到 500ms 的只取消计时，到 2x 的恢复原速。
  endLongPress();
  const f = document.getElementById('seekFeedback');
  // 终点再算一次：move 没来过、或者被浏览器取消过，只要终点距离够都算滑动。
  if (swipeTracking && endX !== undefined && endY !== undefined) {
    const dx = endX - swipeStartX, dy = endY - swipeStartY;
    if (!swipeActive && Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
      swipeActive = true;
      swipeDelta = swipeSeekDelta(dx);
    }
  }
  if (swipeActive) {
    const p = document.getElementById('player');
    if (isFinite(p.duration)) {
      let target = swipeStartTime + swipeDelta;
      if (target < 0) target = 0;
      if (target > p.duration) target = p.duration;
      p.currentTime = target;
      // 滑完松手浏览器还会补一个 click，点在视频上会误触发播放/暂停，
      // 400ms 内的这个 click 直接拦掉，见下面 capture 的 click 监听。
      swipeEndAt = Date.now();
    }
  }
  if (f) { f.classList.remove('show'); clearTimeout(seekFeedbackTimer); }
  swipeActive = false; swipeDelta = 0; swipeTracking = false; swipeStartX = 0; swipeStartY = 0;
}

function chatDateLabel(key){

      }
    });
    const fresh = chronological.filter(m=>!chatDisplayedIds.has(m.msg_id));
    if (!fresh.length) return;
    fresh.forEach(m=>{ chatDisplayedIds.add(m.msg_id); chatMsgHash[m.msg_id] = msgHash(m); if (m.msg_id > chatNewestId) chatNewestId = m.msg_id; });
    const box = document.getElementById('chatMessages');
    if (box.textContent.includes('还没有消息')) box.innerHTML = '';
    const lastMsgEl = box.querySelector('.chat-msg:last-child');
    const lastDate = lastMsgEl ? lastMsgEl.dataset.date : null;
    box.insertAdjacentHTML('beforeend', chatListHtml(fresh, lastDate));
    const nearBottom = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 300);
    if (nearBottom) {
      hideChatNewMsgBar();
      window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
    } else {
      chatUnreadCount += fresh.length;
      const bar = document.getElementById('chatNewMsgBar');
      if (bar) {
        bar.classList.remove('hidden');
        const btn = bar.querySelector('button');
        if (btn) btn.textContent = '有 ' + chatUnreadCount + ' 条新消息，点击查看';
      }
    }
  }catch(e){ /* 静默，下一次再查 */ }
}

let chatSearchQ = '';
let chatSearchOffset = 0;
let chatSearchHasMore = false;
let chatSearchLoading = false;
let chatSearching = false;
async function searchChatMessages(){
  const q = document.getElementById('chatSearchInput').value.trim();
  if (!q || !currentChatChannelId) return;
  chatSearching = true; chatSearchQ = q; chatSearchOffset = 0; chatSearchHasMore = false;
  document.getElementById('clearChatSearchBtn').classList.remove('hidden');
  document.getElementById('chatLoadMoreWrap').classList.add('hidden');

}
async function loadSearchPage(append){
  if (chatSearchLoading) return;
  chatSearchLoading = true;
  const btn = document.getElementById('chatSearchNextBtn');
  if (append) { btn.disabled = true; btn.textContent = '正在加载…'; }
  try{
    const d = await api(`/api/search-messages?channel_id=${currentChatChannelId}&q=${encodeURIComponent(chatSearchQ)}&limit=30&offset_id=${chatSearchOffset}` + (currentChannelUsername ? `&username=${encodeURIComponent(currentChannelUsername)}` : ''));
    const box = document.getElementById('chatMessages');
    if (!append) {
      box.innerHTML = d.messages.length ? d.messages.map(m=>chatBubble(m, currentChatChannelId)).join('')
        : '<div class="muted">没搜到这个关键词。</div>';
    } else if (d.messages.length) {
      const oldCount = box.children.length;
      box.insertAdjacentHTML('beforeend', d.messages.map(m=>chatBubble(m, currentChatChannelId)).join(''));
      const firstNew = box.children[oldCount];
      if (firstNew) firstNew.scrollIntoView({behavior:'smooth', block:'start'});
    }
    chatSearchHasMore = !!d.has_more;
    chatSearchOffset = d.next_offset_id || chatSearchOffset;
    const wrap = document.getElementById('chatSearchNextWrap');
    if (chatSearchHasMore) {
      wrap.classList.remove('hidden');
      btn.disabled = false; btn.textContent = '下一页';
      document.getElementById('chatSearchNextStatus').textContent = '';
    } else if (append) {
      wrap.classList.remove('hidden');
      btn.disabled = true; btn.textContent = '已经没有更多了';
    } else {
      wrap.classList.add('hidden');
    }
  }catch(e){ alert(e.message); await refreshStatus(); }
  chatSearchLoading = false;
}

// 发消息发两遍的原因就在这里，原来的 sendChatMessage 没有防重：
// 1）输入框是等服务器返回后才清空的，发送请求要 1～2 秒，这期间再点一次发送
//    或再按一次回车，输入框里还是同一句话，就会再发一次真正的请求，
//    对方就收到两条一模一样的消息；
// 2）3 秒轮询可能在发送返回之前就已经把这条消息拉下来显示了，发送返回后
//    又不检查就再追加一条，页面上也会出现两条（即使服务器其实只收到一条）。
// 修法：发送中加锁 + 按钮禁用 + 先清空输入框（失败再把原文恢复），
// 返回后先查 chatDisplayedIds，轮询已经显示过的就不重复追加。
let chatSending = false;
async function sendChatMessage(){
  if (chatSending) return;
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('chatSendBtn');
  const text = input.value.trim();
  if (!text) return;
  chatSending = true;
  if (btn) btn.disabled = true;
  input.value = '';
  try{
    const d = await api('/api/send',{method:'POST', body:JSON.stringify({channel_id: currentChatChannelId, text, username: currentChannelUsername || null})});
    const box = document.getElementById('chatMessages');
    if (box.textContent.includes('还没有消息')) box.innerHTML = '';
    if (d.message && d.message.msg_id) {
      if (chatDisplayedIds.has(d.message.msg_id)) {
        chatMsgHash[d.message.msg_id] = msgHash(d.message);
        if (d.message.msg_id > chatNewestId) chatNewestId = d.message.msg_id;
        return;
      }
      chatDisplayedIds.add(d.message.msg_id);
      chatMsgHash[d.message.msg_id] = msgHash(d.message);
      if (d.message.msg_id > chatNewestId) chatNewestId = d.message.msg_id;
    }
    const lastMsgEl = box.querySelector('.chat-msg:last-child');
    const lastDate = lastMsgEl ? lastMsgEl.dataset.date : null;
    box.insertAdjacentHTML('beforeend', chatListHtml([d.message], lastDate));
    input.scrollIntoView({behavior:'smooth', block:'end'});
  }catch(e){
    input.value = text;
    alert(e.message);
  }finally{
    chatSending = false;
    if (btn) btn.disabled = false;
  }
}
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendChatMessage(); } });

async function loadCommentPage(appendOlder){
  const box = document.getElementById('commentMessages');
  const btn = document.getElementById('commentLoadMoreBtn');
  if (appendOlder) { btn.disabled = true; btn.textContent = '正在加载…'; }
  try{
    const d = await api(`/api/comments?channel_id=${commentChannelId}&msg_id=${commentMsgId}&limit=30&offset_id=${commentOldestId}` + (currentChannelUsername ? `&username=${encodeURIComponent(currentChannelUsername)}` : ''));
    commentDiscChannelId = d.discussion_channel_id || commentChannelId;
    const chronological = [...d.messages].reverse();
    if (!appendOlder) {
      box.innerHTML = d.messages.length ? chatListHtml(chronological, null, commentDiscChannelId, '') : '<div class="muted">这个帖子还没有评论。</div>';
      window.scrollTo({top:document.body.scrollHeight, behavior:'auto'});
    } else if (d.messages.length) {
      const oldHeight = document.body.scrollHeight;
      const oldScrollY = window.scrollY;
      box.insertAdjacentHTML('afterbegin', chatListHtml(chronological, null, commentDiscChannelId, ''));
      dedupeDateSeps(box);
      window.scrollTo({top: oldScrollY + (document.body.scrollHeight - oldHeight), behavior:'auto'});
    }
    commentHasMore = !!d.has_more;
    commentOldestId = d.next_offset_id || commentOldestId;
    const wrap = document.getElementById('commentLoadMoreWrap');
    if (commentHasMore) { wrap.classList.remove('hidden'); btn.disabled = false; btn.textContent = '加载更早的评论'; }
    else { wrap.classList.add('hidden'); }
  }catch(e){ box.innerHTML = '<div class="muted">' + esc(e.message) + '</div>'; }
}

let kbCache = {};
async function clickInlineBtn(channelId, msgId, row, col){
  const btn = (kbCache[channelId + ':' + msgId] || [])[row] ? kbCache[channelId + ':' + msgId][row][col] : null;
  if (!btn) return;
  if (btn.type === 'switch' && btn.query) {
    const inp = document.getElementById('chatSearchInput');
    if (inp) { inp.value = btn.query; searchChatMessages(); }
    return;
  }
  try{
    const d = await api('/api/callback',{method:'POST', body:JSON.stringify({channel_id: channelId, msg_id: msgId, row, col, username: currentChannelUsername || null})});
    if (d.url) {
      if (!/^https?:\/\//.test(d.url)) alert('这个链接不是 http/https，已拦截：' + d.url);
      // 机器人回调回来的链接也都在本页打开：t.me 走 openTmeLink，在 tgweb 里打开；
      // 非 t.me 的直接换当前标签页地址，不 window.open 新标签页。
      else if (isTmeUrl(d.url)) openTmeLink(d.url);
      else location.href = d.url;
    }
    else if (d.alert) alert(d.alert);
    // 机器人点完按钮一般会改原消息或发新消息（比如下一页），等一下再刷新聊天就能看到
    setTimeout(()=>{
      chatSearching = false; chatSearchQ = ''; chatSearchOffset = 0; chatSearchHasMore = false;
      const csi = document.getElementById('chatSearchInput'); if (csi) csi.value = '';
      document.getElementById('clearChatSearchBtn').classList.add('hidden');
      document.getElementById('chatSearchNextWrap').classList.add('hidden');
      chatOldestId = 0; chatHasMore = false;
      loadChatPage(false);
    }, 800);
  }catch(e){ alert(e.message); }
}
function playVideo(channelId, msgId){
  // 只弹出播放器，不滚动页面、不移动列表位置
  const p = document.getElementById('player');
  // 播放器自己占一个历史条目：返回时先弹回这个条目、只关播放器，
  // 再返回才回评论/聊天，这样评论里播视频再返回就不会直接出网页。
  // 已经打开时换视频不重复 push，免得关一次要返回两次。
  if (document.getElementById('playerModal').classList.contains('hidden')) {
    tgwebPushState();
    playerHistoryPushed = true;
  }
  document.getElementById('playerModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  playerDragging = false;
  // 先清掉上一个视频的竖屏标记：新视频尺寸还没出来之前，默认按横屏位置放，
  // 等下面 loadedmetadata 判出尺寸再决定要不要贴底，不会把上一个竖屏的位置带过来。
  document.querySelector('#playerModal .modal-box').classList.remove('portrait-video');
  p.src = `${WEB_BASE}/stream/${channelId}/${msgId}` + (currentChannelUsername ? `?username=${encodeURIComponent(currentChannelUsername)}` : ''); p.play().catch(()=>{});
  updatePlayerProgress();
}
// 播放时先判断视频尺寸：元数据一到就看 videoHeight 和 videoWidth，
// 高大于宽就是竖屏，给框加 portrait-video 类走贴底不动；横屏和正方形不加，
// 保持原来往上抬半框的位置。元数据没到之前不判，默认横屏位置，不会闪一下贴底。
document.getElementById('player').addEventListener('loadedmetadata', ()=>{
  const p = document.getElementById('player');
  const box = document.querySelector('#playerModal .modal-box');
  if (!box || !p.videoWidth || !p.videoHeight) return;
  box.classList.toggle('portrait-video', p.videoHeight > p.videoWidth);
});
document.getElementById('searchResults').addEventListener('click', e=>{
  if (!document.getElementById('channelDeleteModal').classList.contains('hidden')) return;
  const btn = e.target.closest('button');
  if (btn && btn.dataset.action === 'close') { hideSearchResults(); return; }
  const item = e.target.closest('.search-item');
  if (!item) return;
  const id = Number(item.dataset.id);
  const title = item.dataset.title || '';
  const username = item.dataset.username || '';
  if (btn) {
    if (btn.dataset.action === 'join') { joinChannel(btn.dataset.ch); return; }
    // 从全部频道列表点进来是新的起点，不是链接链，栈要清空，返回时才直接回列表
    navStack = [];
    if (btn.dataset.action === 'chat') { loadChat(id, title, username); return; }
    if (btn.dataset.action === 'video') { loadVideos(id, title, username); return; }
  }
  navStack = [];
  loadChat(id, title, username);
});

  // 弹框在松手前就盖住了全屏，click 根本落不到 #channels 上，标记就一直残留，
  // 导致长按后的下一次短按被白白吞掉一次，点一下没反应，再点才进频道。
  if (!document.getElementById('channelDeleteModal').classList.contains('hidden')) return;

// 长按检测：pointer 事件同时覆盖触屏和鼠标按住。500 毫秒到了就弹删除框，
// 松手、取消、手指滑动超过 20 像素都算没按住，直接取消计时，正常滑动列表不会误弹。
// 500 毫秒而不是 600 毫秒：手机浏览器长按到一定时间会自己弹系统菜单并取消 pointer，
// 计时太长就永远等不到弹框；阈值放宽到 20 像素是手指按住时轻微抖动也不会误取消。
let longPressTimer = null;
let longPressStartX = 0;
let longPressStartY = 0;
const channelsEl = document.getElementById('channels');
function cancelLongPress(){
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
}
channelsEl.addEventListener('pointerdown', e=>{
  const card = e.target.closest('.channel-card');
  if (!card) return;
  cancelLongPress();
  longPressStartX = e.clientX;
  longPressStartY = e.clientY;
  longPressTimer = setTimeout(()=>{
    longPressTimer = null;
    showChannelDelete(Number(card.dataset.id), card.dataset.title || '', card.dataset.username || '', card.dataset.type || 'channel');
  }, 500);
});
channelsEl.addEventListener('pointerup', cancelLongPress);
channelsEl.addEventListener('pointercancel', cancelLongPress);
channelsEl.addEventListener('pointerleave', cancelLongPress);
channelsEl.addEventListener('pointermove', e=>{
  if (!longPressTimer) return;
  if (Math.abs(e.clientX - longPressStartX) > 20 || Math.abs(e.clientY - longPressStartY) > 20) cancelLongPress();
});
// 手机长按本来会弹出系统菜单/选词，而且有的浏览器在弹系统菜单时会直接取消 pointer，
// 导致上面 500 毫秒的计时永远跑不到。所以系统菜单事件本身也当作长按处理：
// 禁掉系统菜单，直接弹我们的删除框。电脑上右键卡片也会弹这个框，同样能删。
channelsEl.addEventListener('contextmenu', e=>{
  const card = e.target.closest('.channel-card');
  if (!card) return;
  e.preventDefault();
  cancelLongPress();
  showChannelDelete(Number(card.dataset.id), card.dataset.title || '', card.dataset.username || '', card.dataset.type || 'channel');
});
// 搜索结果长按也能删：私聊不在全部频道列表里，搜出来才是删私聊的入口，
// 所以搜索结果也用同一套长按逻辑。按在加入/聊天/视频按钮上不算长按，
// 不然按住加入按钮也会弹删除框；只按在条目本身（标题那行）才弹。
const searchEl = document.getElementById('searchResults');
let searchLongPressTimer = null;

  }, 500);
});
searchEl.addEventListener('pointerup', cancelSearchLongPress);
searchEl.addEventListener('pointercancel', cancelSearchLongPress);
searchEl.addEventListener('pointerleave', cancelSearchLongPress);
searchEl.addEventListener('pointermove', e=>{
  if (!searchLongPressTimer) return;
  if (Math.abs(e.clientX - searchLongPressStartX) > 20 || Math.abs(e.clientY - searchLongPressStartY) > 20) cancelSearchLongPress();

searchEl.addEventListener('contextmenu', e=>{
  if (e.target.closest('button')) return;
